# Cloudflare R2 Configuration Example
#
# R2 is Cloudflare's S3-compatible object storage service.
# Get your credentials from the Cloudflare dashboard:
# https://dash.cloudflare.com/ -> R2 -> Manage R2 API Tokens
#
# Usage:
#   1. Copy this file: cp config/r2.config.example.yaml config/r2.config.yaml
#   2. Fill in your R2 credentials
#   3. Run: cargo run --example r2_sync_mark_price -- --config config/r2.config.yaml --dry-run

# S3-compatible storage configuration (R2)
s3:
  # Provider type for R2
  provider: "r2"
  
  # Your R2 Access Key ID
  # Get from: Cloudflare Dashboard -> R2 -> Manage R2 API Tokens
  access_key_id: ""
  
  # Your R2 Secret Access Key
  secret_access_key: ""
  
  # Your R2 bucket name
  bucket: "temp"
  
  # R2 region is always "auto"
  region: "auto"
  
  # R2 endpoint format: https://<account_id>.r2.cloudflarestorage.com
  # Replace YOUR_ACCOUNT_ID with your Cloudflare account ID
  # Find it in: Cloudflare Dashboard -> R2 (on the right side)
  endpoint: ""
  
  # R2 uses virtual-hosted style (false for path-style)
  force_path_style: false
  
  # Cache database path for sync state tracking
  # Default: ./.r2_sync_cache
  cache_db_path: "./db/.r2_sync_cache.db"

  use_compression: true
  


